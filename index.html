<body>

        
        <form class="form-request" id="form-request">
            <h1> Buscador de repositórios</h1>
            <input type="text" name="consulta-api" id="consulta-api" placeholder="digite um termo e encontre repositórios públicos do Github" required autocomplete="off">
            <input type="submit" value="Buscar" id="busca-api">
        </form>

        <section class="form-response">

            <label class="show-message" id="show-message" for="consulta-api">Busque por um repositório</label>

            <div id="results"></div>
            
        </section>
